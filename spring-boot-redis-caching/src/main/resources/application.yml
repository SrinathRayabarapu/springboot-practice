spring:
  application:
    name: spring-boot-redis-caching
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cache:
    type: redis
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8085}

caching:
  product:
    ttl-seconds: ${CACHE_PRODUCT_TTL_SECONDS:300}
    stampede-lock-wait-seconds: ${CACHE_STAMPEDE_LOCK_WAIT_SECONDS:3}
    stampede-lock-lease-seconds: ${CACHE_STAMPEDE_LOCK_LEASE_SECONDS:10}
  write-behind:
    queue-key: ${CACHE_WRITE_BEHIND_QUEUE_KEY:analytics:page-views}
    flush-delay-ms: ${CACHE_WRITE_BEHIND_FLUSH_DELAY_MS:2000}
    batch-size: ${CACHE_WRITE_BEHIND_BATCH_SIZE:50}

logging:
  level:
    com.example.caching: INFO
    org.springframework.cache: INFO
