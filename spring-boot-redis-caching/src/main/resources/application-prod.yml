# Cloud-ready profile. Bind standard Spring env vars so ElastiCache / Azure Redis / RDS
# can be swapped in without code changes, e.g.:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   SPRING_REDIS_HOST, SPRING_REDIS_PORT, SPRING_REDIS_PASSWORD
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
        jdbc:
          time_zone: UTC
  redis:
    host: ${SPRING_REDIS_HOST}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
    ssl: ${SPRING_REDIS_SSL:false}
    timeout: ${SPRING_REDIS_TIMEOUT:2000ms}
    lettuce:
      pool:
        max-active: ${SPRING_REDIS_LETTUCE_POOL_MAX_ACTIVE:32}
        max-idle: ${SPRING_REDIS_LETTUCE_POOL_MAX_IDLE:16}
        min-idle: ${SPRING_REDIS_LETTUCE_POOL_MIN_IDLE:8}

caching:
  product:
    ttl-seconds: ${CACHE_PRODUCT_TTL_SECONDS:600}

logging:
  level:
    com.example.caching: INFO
    root: WARN
