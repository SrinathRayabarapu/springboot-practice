spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        jdbc:
          time_zone: UTC
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    ssl: ${REDIS_SSL:false}
    timeout: ${REDIS_TIMEOUT:2000ms}
    lettuce:
      pool:
        max-active: ${REDIS_POOL_MAX_ACTIVE:32}
        max-idle: ${REDIS_POOL_MAX_IDLE:16}
        min-idle: ${REDIS_POOL_MIN_IDLE:8}

redisson:
  address: ${REDISSON_ADDRESS:}
  password: ${REDIS_PASSWORD:}
  connection-pool-size: ${REDISSON_CONNECTION_POOL_SIZE:64}
  connection-minimum-idle-size: ${REDISSON_CONNECTION_MINIMUM_IDLE_SIZE:24}

caching:
  product:
    ttl-seconds: ${CACHE_PRODUCT_TTL_SECONDS:600}

logging:
  level:
    com.example.caching: INFO
    root: WARN
