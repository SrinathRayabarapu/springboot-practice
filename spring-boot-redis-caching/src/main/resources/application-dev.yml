spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:cachingdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: ${REDIS_TIMEOUT:2000ms}
    lettuce:
      pool:
        max-active: ${REDIS_POOL_MAX_ACTIVE:8}
        max-idle: ${REDIS_POOL_MAX_IDLE:8}
        min-idle: ${REDIS_POOL_MIN_IDLE:0}

redisson:
  address: ${REDISSON_ADDRESS:}
  password: ${REDIS_PASSWORD:}
  connection-pool-size: ${REDISSON_CONNECTION_POOL_SIZE:10}
  connection-minimum-idle-size: ${REDISSON_CONNECTION_MINIMUM_IDLE_SIZE:2}

logging:
  level:
    com.example.caching: DEBUG
